<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkSwap</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1 class="wordmark">InkSwap</h1>

      <!-- The main control, drawn as a speech bubble: on/off for the current tab. -->
      <label class="power" id="power">
        <span class="power-text">
          <strong id="power-title">Off for this tab</strong>
          <span id="power-sub">Switch on to translate this chapter</span>
        </span>
        <input id="on" type="checkbox" role="switch" class="switch" disabled />
      </label>
      <p id="hint" class="hint">Paste your Claude API key to start.</p>

      <section class="settings" aria-label="Settings">
        <div class="setting">
          <span class="name" id="language-label">Language</span>
          <div class="segmented" role="radiogroup" aria-labelledby="language-label">
            <label><input type="radio" name="language" value="en" /><span>English</span></label>
            <label><input type="radio" name="language" value="es" /><span>Español</span></label>
            <label><input type="radio" name="language" value="fr" /><span>Français</span></label>
          </div>
        </div>

        <div class="setting">
          <div class="setting-head">
            <label class="name" for="opacity">Bubble opacity</label>
            <output id="opacity-value" for="opacity">95%</output>
          </div>
          <div class="opacity">
            <input id="opacity" type="range" min="0.5" max="1" step="0.05" value="0.95" />
            <!-- A tiny bubble showing what this opacity looks like over the original text. -->
            <span class="preview" aria-hidden="true">
              <span class="preview-raw">こんにちは</span>
              <span class="preview-fill" id="preview-fill"></span>
              <span class="preview-text">Hi!</span>
            </span>
          </div>
        </div>

        <label class="setting switch-row">
          <span class="name">Chime <small>On the first translated page</small></span>
          <input id="chime" type="checkbox" role="switch" class="switch small" />
        </label>
        <label class="setting switch-row">
          <span class="name">Toasts <small>When a page or chapter is translated</small></span>
          <input id="toasts" type="checkbox" role="switch" class="switch small" />
        </label>
        <div class="setting switch-row saved-row">
          <span class="name">Saved translations <small id="saved-count">Pages you've translated come back free</small></span>
          <button id="clear-saved" type="button" class="inked clear">Clear</button>
        </div>
      </section>

      <section class="key">
        <label for="key">Claude API key</label>
        <div class="key-field">
          <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false" />
          <button id="save" type="button" class="inked">Save</button>
        </div>
        <p id="saved" class="saved" hidden>Saved ✓</p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
